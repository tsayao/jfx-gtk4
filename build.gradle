// Plugin

// OpenGL: the GLSL that the JSL compiler generates is used as is, and the
// static shaders of Vulkan are turned into OpenGL 4.5 core shaders

tasks.register('copyPrismGLShaders', Copy) {
    dependsOn 'generatePrismShaders'
    from gensrc.map { it.dir('jsl-prism/com/sun/prism/gl/glsl') }
    into glslDir.map { it.dir('resources/com/sun/prism/gl/glsl') }
}

tasks.register('copyDecoraGLShaders', Copy) {
    dependsOn 'generateDecoraShaders'
    from gensrc.map { it.dir('jsl-decora/com/sun/scenario/effect/impl/hw/gl/glsl') }
    into glslDir.map { it.dir('resources/com/sun/scenario/effect/impl/hw/gl/glsl') }
}

tasks.register('generateGLStaticShaders') {
    description = 'Turns the static Vulkan shaders into OpenGL 4.5 core shaders'
    def sourceDir = file('shaders/vk')
    def destinationDir = glslDir.get().dir('resources/com/sun/prism/gl/glsl').asFile
    inputs.dir sourceDir
    outputs.dir destinationDir
    doLast {
        destinationDir.mkdirs()
        fileTree(sourceDir) { include '*.vert', '*.frag' }.each { f ->
            def text = f.getText('UTF-8')
                // OpenGL has no descriptor sets
                .replace('set = 0, ', '')
                // The push constants become a uniform block at binding 1
                .replace('layout(push_constant) uniform', 'layout(std140, binding = 1) uniform')
                .replaceFirst(/(?m)^#version 450$/, '#version 450 core')
            // Specialization constants become macros, which the pipeline defines
            text = text.replaceAll(/(?m)^layout\(constant_id = \d+\) const \w+ (\w+) = ([^;]+);(.*)$/) { all, name, value, comment ->
                "#ifndef ${name}\n#define ${name} ${value}${comment}\n#endif"
            }
            new File(destinationDir, f.name).setText(text, 'UTF-8')
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'generateGtk4Wrappers', 'generateVulkanBindings'
    options.compilerArgs += jfxModuleArgs
}

tasks.named('processResources') {
    dependsOn 'compilePrismSPIRVShaders', 'compileDecoraSPIRVShaders', 'compileVKStaticShaders'
    dependsOn 'copyPrismGLShaders', 'copyDecoraGLShaders', 'generateGLStaticShaders'
}

tasks.named('jar') {
    archiveFileName = 'jfx-gtk4.jar'
}

def runArgs = { lib ->
    moduleArgs(lib) + [
        '--enable-native-access=javafx.graphics,ALL-UNNAMED',
        '-Dglass.platform=Gtk4',
        '-Dprism.order=vk,gl,sw',
    ]
}

// Paths under the home directory are written relative to the project directory,
// so that build/run.args does not name the home directory of the user
def userHome = new File(System.getProperty('user.home')).toPath().toAbsolutePath().normalize()
def projectPath = rootDir.toPath().toAbsolutePath().normalize()
def portablePath = { File f ->
    def path = f.toPath().toAbsolutePath().normalize()
    (path.startsWith(userHome) ? projectPath.relativize(path) : path).toString()
}

tasks.register('writeRunArgs') {
    description = 'Writes the JVM arguments to run an application with this platform to build/run.args'
    def jar = tasks.named('jar').flatMap { it.archiveFile }
    def out = layout.buildDirectory.file('run.args')
    def args = runArgs(portablePath(jfxLib))
    inputs.property('runArgs', args)
    outputs.file out
    doLast {
        def all = args + ['--add-modules=ALL-MODULE-PATH', '-cp', portablePath(jar.get().asFile)]
        out.get().asFile.text = all.collect { '"' + it.replace('\\', '\\\\') + '"' }.join('\n') + '\n'
    }
}

tasks.named('jar') {
    finalizedBy 'writeRunArgs'
}

tasks.register('runArgs') {
    description = 'Prints the JVM arguments to run an application with this platform'
    def jar = tasks.named('jar').flatMap { it.archiveFile }
    dependsOn 'jar'
    doLast {
        println((runArgs(jfxLib) + ['-cp', jar.get().asFile.toString()]).join(' '))
    }
}
