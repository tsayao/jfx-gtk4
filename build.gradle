    dependsOn 'checkRequirements'
    girFiles = project.files(girPackages.keySet().collect { "${girDir}/${it}" })
    includeClasses = gtk4Classes
    includeNamespaceFunctions = ["Gdk", "Gtk", "Adw", "GLib", "GObject", "Gio"]
