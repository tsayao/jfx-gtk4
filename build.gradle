    jslc {
        java.srcDirs = ['jslc/java', genDir.map { it.dir('antlr') }]
        resources.srcDirs = ['jslc/resources']
        compileClasspath += configurations.antlr
        runtimeClasspath += configurations.antlr
    }
    main {
        java.srcDirs += [genDir.map { it.dir('gtk4') }, genDir.map { it.dir('vk') }]
        resources.srcDir spirvDir.map { it.dir('resources') }
        resources.srcDir glslDir.map { it.dir('resources') }
    }
}

