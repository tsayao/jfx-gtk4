// JSL compiler

tasks.register('generateGrammarSource', JavaExec) {
    def wd = file('jslc/antlr')
    def outDir = genDir.get().dir('antlr').asFile
    classpath = configurations.antlr
    workingDir = wd
    mainClass = 'org.antlr.v4.Tool'
    args = ['-o', outDir.toString(), '-package', 'com.sun.scenario.effect.compiler', '-visitor',
            'com/sun/scenario/effect/compiler/JSL.g4']
    inputs.dir wd
    outputs.dir outDir
}

tasks.named('compileJslcJava') {
    dependsOn 'generateGrammarSource'
}

['Prism', 'Decora'].each { name ->
    def lowerName = name.toLowerCase()
    tasks.register("compile${name}Compilers", JavaCompile) {
        dependsOn 'compileJslcJava'
        source = fileTree("shaders/jsl-${lowerName}") { include '**/*.java' }
        classpath = sourceSets.jslc.output + configurations.antlr
        destinationDirectory = layout.buildDirectory.dir("classes/jsl-compilers/${lowerName}")
        options.compilerArgs += ['-implicit:none'] + shaderCompilerArgs
    }
}

def jslcClasspath = { String lowerName ->
    files(sourceSets.jslc.output, configurations.antlr,
          layout.buildDirectory.dir("classes/jsl-compilers/${lowerName}"), "shaders/jsl-${lowerName}")
}

tasks.register('generatePrismShaders') {
    dependsOn 'compilePrismCompilers'
    def sourceDir = file('shaders/jsl-prism')
    def destinationDir = gensrc.get().dir('jsl-prism').asFile
    inputs.dir sourceDir
    outputs.dir destinationDir
    def execOps = project.services.get(ExecOperations)
    def cp = jslcClasspath('prism')
    doLast {
        fileTree(sourceDir) { include '**/*.jsl' }.each { jsl ->
            execOps.javaexec {
                classpath = cp
                mainClass = 'CompileJSL'
                jvmArgs = shaderCompilerArgs
                args = ['-i', sourceDir, '-o', destinationDir, '-t', '-pkg', 'com/sun/prism', '-vk', '-gl',
                        '-name', jsl]
            }
        }
    }
}

tasks.register('generateDecoraShaders') {
    dependsOn 'compileDecoraCompilers'
    def sourceDir = file('shaders/jsl-decora')
    def destinationDir = gensrc.get().dir('jsl-decora').asFile
    inputs.dir sourceDir
    outputs.dir destinationDir
    def execOps = project.services.get(ExecOperations)
    def cp = jslcClasspath('decora')
    doLast {
        execOps.javaexec {
            classpath = cp
            mainClass = 'GenAllDecoraShaders'
            jvmArgs = shaderCompilerArgs
            args = ['-i', sourceDir, '-o', destinationDir, '-t', '-pkg', 'com/sun/scenario/effect', '-vk', '-gl',
                    '-all', 'GenAllDecoraShaders']
        }
    }
}

