tasks.register('checkRequirements') {
    description = 'Checks that the files and tools needed by the build are installed'
    def sdkDir = jfxSdk
    def gir = file(girDir)
    def registry = file(vkRegistry)
    doLast {
        def missing = []
        ['javafx.base.jar', 'javafx.graphics.jar'].each { jar ->
            if (!new File(sdkDir, "lib/${jar}").isFile()) {
                missing << "JavaFX SDK: ${sdkDir}/lib/${jar} (set -PjfxSdk=DIR)".toString()
            }
        }
        def graphics = new File(sdkDir, 'lib/javafx.graphics.jar')
        if (graphics.isFile()) {
            new java.util.zip.ZipFile(graphics).withCloseable { zip ->
                ['com/sun/glass/ui/gtk4/', 'com/sun/prism/vk/'].each { pkg ->
                    if (zip.entries().find { it.name.startsWith(pkg) } != null) {
                        missing << "JavaFX SDK without the ${pkg} package: ${graphics} contains it and would hide the plugin classes".toString()
                    }
                }
            }
        }
        girPackages.each { name, pkg ->
            if (!new File(gir, name).isFile()) {
                missing << "GObject introspection file: ${gir}/${name} (Fedora: ${pkg}; or set -PgirDir=DIR)".toString()
            }
        }
        def girTypes = [:].withDefault { name ->
            def f = new File(gir, name)
            f.isFile() ? (f.text =~ /<(?:class|interface|record) name="([^"]+)"/).collect { it[1] } as Set : null
        }
        def absent = gtk4Classes.findAll { qualified ->
            def (ns, type) = qualified.tokenize('.')
            def types = girTypes[girNamespaces[ns]]
            types != null && !types.contains(type)
        }
        if (!absent.isEmpty()) {
            missing << "GObject introspection types: ${absent.join(', ')}".toString()
        }
        // The wrappers are generated from the GTK 4.22 API, and the glass checks the
        // version of GTK at run time, so the plugin built with it runs on GTK 4.14
        def gtkGir = new File(gir, 'Gtk-4.0.gir')
        if (gtkGir.isFile()) {
            def minor = (gtkGir.text =~ /version="4\.(\d+)"/).collect { it[1] as int }.max() ?: 0
            if (minor < 22) {
                missing << ("GObject introspection files of GTK 4.22 or later: ${gtkGir} is of GTK 4.${minor}; "
                        + "build on a system with GTK 4.22, or set -PgirDir=DIR to its gir-1.0 directory "
                        + "(the plugin runs on GTK 4.14)").toString()
            }
        }
        if (!registry.isFile()) {
            missing << "Vulkan registry: ${registry} (Fedora: vulkan-headers; or set -PvkRegistry=FILE)".toString()
        }
        if (!com.sun.javafx.gradle.CompileSPIRVTask.isCompilerAvailable()) {
            missing << 'SPIR-V compiler: libshaderc or glslc (Fedora: libshaderc or glslc)'
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing build requirements:\n  - " + missing.join('\n  - '))
        }
    }
}

